<text x="380" y="28" text-anchor="middle" class="title">Claude + whoop-mcp (read-only)</text>
<g class="i0"><rect x="468" y="64" width="264" height="40" rx="14" class="user"/><text x="484" y="91" class="utext">Why is my recovery low today?</text></g>
<g class="i1"><rect x="28" y="126" width="176" height="26" rx="13" class="chip"/><text x="40" y="143.5" class="ctext">⚙ get_daily_overview</text></g>
<g class="i2"><text x="28" y="174" class="atext">Your recovery is actually 76% — that&#39;s in the green, not low! But if it feels lower than usual,</text></g>
<g class="i3"><text x="28" y="196" class="atext">here&#39;s what likely pulled it down:</text></g>
<g class="i4"><text x="28" y="218" class="atext"></text></g>
<g class="i5"><text x="28" y="240" class="atext">Sleep duration was short. You slept only 5.5 hours against a need of 7.2 hours (78% sleep</text></g>
<g class="i6"><text x="28" y="262" class="atext">performance). That&#39;s about 1.7 hours of sleep debt.</text></g>
<g class="i7"><text x="28" y="284" class="atext"></text></g>
<g class="i8"><text x="28" y="306" class="atext">Sleep consistency was low at 58%, meaning your sleep/wake timing has been irregular lately.</text></g>
<g class="i9"><text x="28" y="328" class="atext"></text></g>
<g class="i10"><text x="28" y="350" class="atext">REM sleep was only 0.6 hours, which is on the low side — likely a consequence of the shorter</text></g>
<g class="i11"><text x="28" y="372" class="atext">sleep.</text></g>
<g class="i12"><text x="28" y="394" class="atext"></text></g>
<g class="i13"><text x="28" y="416" class="atext">Your HRV (77.4 ms) and resting HR (42 bpm) look solid, which is why recovery still scored green</text></g>
<g class="i14"><text x="28" y="438" class="atext">despite the sleep deficit. Getting closer to that 7+ hour sleep need should bump you back up.</text></g>
