<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" role="img" aria-label="Claude answering Why is my recovery low today? using whoop-mcp">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.card{fill:#0d1117;stroke:#30363d}.title{fill:#8b949e;font-size:12px}
.user{fill:#1f6feb}.utext{fill:#fff}.chip{fill:#161b22;stroke:#30363d}.ctext{fill:#7ee787;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.atext{fill:#e6edf3}
</style>
<rect x="0.5" y="0.5" width="759" height="487" rx="12" class="card"/>
<circle cx="24" cy="24" r="6" fill="#ff5f57"/><circle cx="44" cy="24" r="6" fill="#febc2e"/><circle cx="64" cy="24" r="6" fill="#28c840"/>
<text x="380" y="28" text-anchor="middle" class="title">Claude + whoop-mcp (read-only)</text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.5514;0.5778;1" dur="13.24s" repeatCount="indefinite"/><rect x="468" y="64" width="264" height="40" rx="14" class="user"/><text x="484" y="91" class="utext">Why is my recovery low today?</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.6420;0.6684;1" dur="13.24s" repeatCount="indefinite"/><rect x="28" y="126" width="176" height="26" rx="13" class="chip"/><text x="40" y="143.5" class="ctext">⚙ get_daily_overview</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7100;0.7364;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="174" class="atext">Your recovery is actually 76% — that&#39;s in the green, not low! But if it feels lower than usual,</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7236;0.7500;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="196" class="atext">here&#39;s what likely pulled it down:</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7372;0.7636;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="218" class="atext"></text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7508;0.7772;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="240" class="atext">Sleep duration was short. You slept only 5.5 hours against a need of 7.2 hours (78% sleep</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7644;0.7908;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="262" class="atext">performance). That&#39;s about 1.7 hours of sleep debt.</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7779;0.8044;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="284" class="atext"></text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.7915;0.8180;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="306" class="atext">Sleep consistency was low at 58%, meaning your sleep/wake timing has been irregular lately.</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8051;0.8316;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="328" class="atext"></text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8187;0.8452;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="350" class="atext">REM sleep was only 0.6 hours, which is on the low side — likely a consequence of the shorter</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8323;0.8588;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="372" class="atext">sleep.</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8459;0.8724;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="394" class="atext"></text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8595;0.8860;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="416" class="atext">Your HRV (77.4 ms) and resting HR (42 bpm) look solid, which is why recovery still scored green</text></g>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4532;0.4834;0.8731;0.8995;1" dur="13.24s" repeatCount="indefinite"/><text x="28" y="438" class="atext">despite the sleep deficit. Getting closer to that 7+ hour sleep need should bump you back up.</text></g>
</svg>
