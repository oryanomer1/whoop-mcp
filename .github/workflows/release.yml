name: Release

# Push a vX.Y.Z tag (via `npm version` + `git push --follow-tags`) to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # Runs the full test suite (including dependency install scripts) without any publishing rights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check tag matches package.json and server.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$(node -p 'require("./package.json").version')"
          test "$TAG" = "$(node -p 'require("./server.json").version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the Claude Desktop / Smithery bundle
        run: npm run bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: |
            build/*.mcpb
            !build/*-smithery.mcpb
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing, and MCP Registry OIDC login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publishing job (avoids cache-poisoning risk).

      # No dependency install scripts run in the job that can mint publishing credentials.
      - run: npm ci --ignore-scripts
      - run: npm run build

      # npm >= 11.5.1 supports trusted publishing (OIDC). Without it configured, NPM_TOKEN is used.
      - run: npm install -g --ignore-scripts npm@11.21.1
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: bundle

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" bundle/*.mcpb --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
